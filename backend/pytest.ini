[pytest]
testpaths = tests
pythonpath = . tests ../pi
addopts = -q --strict-markers
markers =
    integration: needs a live server (TEST_BASE_URL)
    hardware: needs a PN532 and a real tag
    flood: sends many requests and exhausts the rate limiter; must run last
    slow: paper-scale Monte-Carlo reproduction; opt in with RUN_SLOW_MC=1
