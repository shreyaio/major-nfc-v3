<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verification Result</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>Medicine Authenticity Check</h1>
      <p id="tag-echo"></p>
    </header>

    <div id="result-area">
      <div class="status-banner loading">Checking tag&hellip;</div>
    </div>

    <a class="btn" href="index.html" style="display:block; text-align:center; text-decoration:none; margin-top:16px;">
      Check another tag
    </a>

    <p class="footer-note">
      This result is generated by looking up the tag's record on our server and
      decrypting it there &mdash; your device never sees any key material.
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
